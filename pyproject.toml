[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sakaki-gm"
version = "0.1.0"
description = "Local Game Master desk"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyperclip==1.9.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sakaki-gm = "sakaki_gm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
